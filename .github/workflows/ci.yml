name: Project1 CI
on:
  push:
  pull_request:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    needs:
      - test-backend
      - test-frontend
    permissions:
      contents: read
      packages: write 

    steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Login to Github Container Registry
          uses: docker/login-action@v3
          with: 
            registry: ghcr.io
            username: ${{ github.actor}}
            password: ${{ secrets.GITHUB_TOKEN}}

        - name: Build and Push Backend Image
          uses: docker/build-push-action@v6
          with: 
            context: ./bckend
            file: ./bckend/Dockerfile.prod
            push: true
            tags: ghcr.io/kianarhnm/project1-backend:1.0.0

        - name: Build and push Frontend Image
          uses: docker/build-push-action@v6
          with: 
            context: ./front
            file: ./front/Dockerfile.prod
            push: true
            tags: ghcr.io/kianarhnm/project1-frontend:1.0.0

  test-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name : Install Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: pip install -r bckend/requirements.txt

      - name: Test
        run: python bckend/manage.py check

  test-frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: front

    steps: 
    - uses: actions/checkout@v4
    - name: Install Node.js
      uses: actions/setup-node@v4

      with: 
        node-version: "20"
    - name: Install Node Dependencies
      run: npm install

    - name: Build  
      run: npm run build
