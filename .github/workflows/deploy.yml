- name: Deploy to server
  uses: appleboy/ssh-action@v1
  with:
    host: ${{ secrets.SERVER_HOST }}
    username: ${{ secrets.SERVER_USER }}
    key: ${{ secrets.SERVER_SSH_KEY }}
    passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}

    script: |
      cd ~/docker-compose

      docker compose \
      -f compose.yml \
      -f compose.prod.yml \
      up -d

      docker compose ps
