x-template: &template
  restart: unless-stopped

services:

  nginx-proxy:
    <<: *template
    image: nginx:1.31-alpine
    ports:
      - 80:80
      - 443:443
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD","wget","-qO-", "http://localhost/health/"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    <<: *template
    image: postgres:17-alpine
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    env_file:
      - .env.db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d login"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    <<: *template
    build: ./backend
    env_file:
      - .env.backend
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "curl","-f","http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    <<: *template
    build: ./frontend
    depends_on:
      - backend
    env_file:
      - .env.frontend
    healthcheck:
      test: ["CMD", "wget","-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgresql-data:
