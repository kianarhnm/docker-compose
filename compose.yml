services:
  nginx-proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD","wget","-qO-", "http://localhost/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  db:
    image: postgres:17
    volumes:
      - ./data:/var/lib/postgresql/data
    env_file:
      - .env.db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d login"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./bckend
    env_file:
      - .env.backend
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "curl","-f","http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build: ./front
    depends_on:
      - backend
    env_file:
      - .env.frontend
    healthcheck:
      test: ["CMD", "wget","-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgresql:
